[package]
name = "unipress"
version = "1.0.0"
edition = "2024"

[dependencies]
phf = { version = "0.13.1", features = ["macros"] }
bitvec = "1"
base91 = "0.1.0"
clap = { version = "4.0", features = ["derive"] }
wasm-bindgen = "0.2"

[dev-dependencies]
rand = "0.10.1"

[lib]
crate-type = ["cdylib", "rlib"]